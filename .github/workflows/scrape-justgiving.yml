name: Scrape JustGiving

on:
  schedule:
    # Twice a day, at 06:00 and 18:00 UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: npm install playwright@1.62.1

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Scrape JustGiving
        env:
          JUSTGIVING_PAGE_SLUG: ${{ vars.JUSTGIVING_PAGE_SLUG }}
        run: node scripts/scrape-justgiving.mjs

      - name: Commit updated total
        run: |
          if git diff --quiet -- data/settings.json; then
            echo "No change to data/settings.json; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/settings.json
          git commit -m "Update JustGiving total"
          git push
